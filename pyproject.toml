[project]
name = "nyc-taxi-platform"
version = "0.1.0"
description = "NYC Taxi medallion pipeline: Parquet -> Snowflake -> dbt -> Airflow"
requires-python = ">=3.11"
dependencies = [
    "watchdog>=4.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "snowflake-connector-python>=3.12",
    "dbt-snowflake>=1.10,<2.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "streamlit>=1.66.1",
    "plotly>=7.1.0",
]

[tool.uv]
package = false   # this is an application, not a library
